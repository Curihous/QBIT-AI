name: Deploy to EC2

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_REPO }}
  DOCKER_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3
      with:
        install: true
        driver: docker-container

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ secrets.DOCKER_REPO }}:${{ github.sha }}
        cache-from: type=gha,scope=qbit-ai
        cache-to: type=gha,mode=max,scope=qbit-ai

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: 22
        script: |
          # Docker Hub 로그인 & 이미지 풀
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker pull ${{ secrets.DOCKER_REPO }}:${{ github.sha }}

          # 기존 컨테이너 제거
          docker rm -f qbit-ai || true

          # 새 컨테이너 실행
          docker run -d \
            --name qbit-ai \
            --restart unless-stopped \
            -p 8000:8000 \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e OPENAI_MODEL="${{ secrets.OPENAI_MODEL }}" \
            -e OPENAI_MAX_TOKENS="${{ secrets.OPENAI_MAX_TOKENS }}" \
            -e OPENAI_TEMPERATURE="${{ secrets.OPENAI_TEMPERATURE }}" \
            -e BE_SERVER_URL="${{ secrets.BE_SERVER_URL }}" \
            -e MASSIVE_API_KEY="${{ secrets.MASSIVE_API_KEY }}" \
            -e DB_HOST="${{ secrets.DB_HOST }}" \
            -e DB_PORT="${{ secrets.DB_PORT }}" \
            -e DB_NAME="${{ secrets.DB_NAME }}" \
            -e DB_USER="${{ secrets.DB_USER }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            ${{ secrets.DOCKER_REPO }}:${{ github.sha }}

          # 사용하지 않는 이미지 정리
          docker image prune -f

    - name: Notify deployment status
      if: success() || failure()
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
          args: |
            **QBIT-AI 배포 알림**
            
            **상태:** ${{ job.status == 'success' && '✅ 성공' || '❌ 실패' }}
            **브랜치:** ${{ github.ref_name }}
            **커밋:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **실행자:** ${{ github.actor }}

